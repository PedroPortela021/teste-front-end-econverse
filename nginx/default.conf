server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    /* Mesmo comportamento do proxy do Vite: app chama /api/products.json no mesmo origin. */
    location = /api/products.json {
        proxy_pass https://app.econverse.com.br/teste-front-end/junior/tecnologia/lista-produtos/produtos.json;
        proxy_ssl_server_name on;
        proxy_set_header Host app.econverse.com.br;
    }
}
